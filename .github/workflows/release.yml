name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.3.0'
        required: false
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        env:
          TAGIN: ${{ github.event.inputs.tag }}
        run: |
          tag="${TAGIN:-$GITHUB_REF_NAME}"
          test -n "$tag" || { echo "no tag given, nothing to publish"; exit 0; }
          mkdir -p out/SawWiden
          cp dist/sawwiden.mnlgxdunit packaging/INSTALL.txt LICENSE out/SawWiden/
          (cd out/SawWiden && sha256sum * > SHA256SUMS)
          (cd out && zip -r SawWiden_${tag}.zip SawWiden)
          echo "TAG=$tag" >> $GITHUB_ENV
      - name: Publish pre-release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=out/SawWiden_${TAG}.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$f" --clobber
          else
            gh release create "$TAG" "$f" --prerelease --target main --title "SawWiden $TAG" --notes "Unit built from this repo's source. See INSTALL.txt inside the zip."
          fi
